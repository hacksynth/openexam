services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      DATABASE_URL: "postgresql://openexam:openexam@postgres:5432/openexam?schema=public"
      NEXT_PUBLIC_WEB_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_ADMIN_URL: "http://127.0.0.1:3001"
      STORAGE_DRIVER: "local"
      LOCAL_STORAGE_DIR: "./storage"
      SESSION_SECRET: "${SESSION_SECRET:-openexam-local-session-secret}"
      SESSION_DAYS: "${SESSION_DAYS:-14}"
      AI_KEY_ENCRYPTION_SECRET: "${AI_KEY_ENCRYPTION_SECRET:-openexam-local-ai-key-encryption-secret}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENEXAM_WORKER_POLL_MS: "${OPENEXAM_WORKER_POLL_MS:-3000}"
    volumes:
      - openexam-storage:/app/storage
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    environment:
      DATABASE_URL: "postgresql://openexam:openexam@postgres:5432/openexam?schema=public"
      NEXT_PUBLIC_WEB_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_ADMIN_URL: "http://127.0.0.1:3001"
      STORAGE_DRIVER: "local"
      LOCAL_STORAGE_DIR: "./storage"
      SESSION_SECRET: "${SESSION_SECRET:-openexam-local-session-secret}"
      SESSION_DAYS: "${SESSION_DAYS:-14}"
      AI_KEY_ENCRYPTION_SECRET: "${AI_KEY_ENCRYPTION_SECRET:-openexam-local-ai-key-encryption-secret}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENEXAM_WORKER_POLL_MS: "${OPENEXAM_WORKER_POLL_MS:-3000}"
    volumes:
      - openexam-storage:/app/storage
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: "postgresql://openexam:openexam@postgres:5432/openexam?schema=public"
      STORAGE_DRIVER: "local"
      LOCAL_STORAGE_DIR: "./storage"
      SESSION_SECRET: "${SESSION_SECRET:-openexam-local-session-secret}"
      SESSION_DAYS: "${SESSION_DAYS:-14}"
      AI_KEY_ENCRYPTION_SECRET: "${AI_KEY_ENCRYPTION_SECRET:-openexam-local-ai-key-encryption-secret}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENEXAM_DAILY_AI_CALL_LIMIT: "${OPENEXAM_DAILY_AI_CALL_LIMIT:-50}"
      OPENEXAM_DAILY_PLATFORM_TOKEN_LIMIT: "${OPENEXAM_DAILY_PLATFORM_TOKEN_LIMIT:-100000}"
      OPENEXAM_UPLOAD_MAX_BYTES: "${OPENEXAM_UPLOAD_MAX_BYTES:-10485760}"
      OPENEXAM_WORKER_POLL_MS: "${OPENEXAM_WORKER_POLL_MS:-3000}"
    volumes:
      - openexam-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: openexam-postgres
    environment:
      POSTGRES_DB: openexam
      POSTGRES_USER: openexam
      POSTGRES_PASSWORD: openexam
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openexam -d openexam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  openexam-storage:
