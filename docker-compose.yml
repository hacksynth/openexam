services:
  postgres:
    image: postgres:17-alpine
    container_name: openexam-postgres
    environment:
      POSTGRES_DB: openexam
      POSTGRES_USER: openexam
      POSTGRES_PASSWORD: openexam
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openexam -d openexam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
