x-app-environment: &app-environment
  DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://openexam:openexam@postgres:5432/openexam?schema=public}"
  NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-OpenExam}"
  NEXT_PUBLIC_WEB_URL: "${NEXT_PUBLIC_WEB_URL:-http://127.0.0.1:3000}"
  NEXT_PUBLIC_ADMIN_URL: "${NEXT_PUBLIC_ADMIN_URL:-http://127.0.0.1:3000/admin}"
  STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
  LOCAL_STORAGE_DIR: "${DOCKER_LOCAL_STORAGE_DIR:-/app/storage}"
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_ENDPOINT: "${S3_ENDPOINT:-}"
  S3_BUCKET: "${S3_BUCKET:-}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
  S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
  S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
  AWS_PROFILE: "${AWS_PROFILE:-}"
  AUTH_SECRET: "${AUTH_SECRET:-}"
  AUTH_URL: "${AUTH_URL:-}"
  SESSION_SECRET: "${SESSION_SECRET:-openexam-local-session-secret}"
  SESSION_DAYS: "${SESSION_DAYS:-14}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
  AI_KEY_ENCRYPTION_SECRET: "${AI_KEY_ENCRYPTION_SECRET:-openexam-local-ai-key-encryption-secret}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
  OPENAI_API_MODE: "${OPENAI_API_MODE:-}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_BASE_URL: "${GEMINI_BASE_URL:-}"
  OPENEXAM_DAILY_AI_CALL_LIMIT: "${OPENEXAM_DAILY_AI_CALL_LIMIT:-50}"
  OPENEXAM_DAILY_PLATFORM_TOKEN_LIMIT: "${OPENEXAM_DAILY_PLATFORM_TOKEN_LIMIT:-100000}"
  OPENEXAM_UPLOAD_MAX_BYTES: "${OPENEXAM_UPLOAD_MAX_BYTES:-10485760}"
  OPENEXAM_MATERIAL_EXTRACT_CONTEXT_CHARS: "${OPENEXAM_MATERIAL_EXTRACT_CONTEXT_CHARS:-1048576}"
  OPENEXAM_MATERIAL_EXTRACT_TIMEOUT_MS: "${OPENEXAM_MATERIAL_EXTRACT_TIMEOUT_MS:-1200000}"
  OPENEXAM_MATERIAL_EXTRACT_JOB_STALE_MS: "${OPENEXAM_MATERIAL_EXTRACT_JOB_STALE_MS:-1500000}"
  OPENEXAM_IMPORT_EXTERNAL_IMAGES: "${OPENEXAM_IMPORT_EXTERNAL_IMAGES:-true}"
  OPENEXAM_WORKER_POLL_MS: "${OPENEXAM_WORKER_POLL_MS:-3000}"
  OPENEXAM_JOB_STALE_MS: "${OPENEXAM_JOB_STALE_MS:-900000}"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      <<: *app-environment
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-}"
    volumes:
      - openexam-storage:/app/storage
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *app-environment
      OPENEXAM_WORKER_HEALTH_PATH: "${OPENEXAM_WORKER_HEALTH_PATH:-/tmp/openexam-worker-health.json}"
      OPENEXAM_WORKER_HEALTH_MAX_AGE_MS: "${OPENEXAM_WORKER_HEALTH_MAX_AGE_MS:-30000}"
    volumes:
      - openexam-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const fs=require('node:fs');const path=process.env.OPENEXAM_WORKER_HEALTH_PATH||'/tmp/openexam-worker-health.json';const max=Number(process.env.OPENEXAM_WORKER_HEALTH_MAX_AGE_MS||30000);try{const health=JSON.parse(fs.readFileSync(path,'utf8'));const updatedAt=Date.parse(health.updatedAt);const age=Date.now()-updatedAt;process.exit(health.status&&health.status!=='stopped'&&Number.isFinite(updatedAt)&&age>=0&&age<=max?0:1);}catch{process.exit(1);}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  seed:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles:
      - seed
    environment:
      <<: *app-environment
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-}"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed"]

  postgres:
    image: postgres:17-alpine
    container_name: openexam-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-openexam}"
      POSTGRES_USER: "${POSTGRES_USER:-openexam}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-openexam}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-openexam}\" -d \"${POSTGRES_DB:-openexam}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  openexam-storage:
