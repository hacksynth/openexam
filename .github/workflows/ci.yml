name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openexam
          POSTGRES_USER: openexam
          POSTGRES_PASSWORD: openexam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openexam -d openexam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openexam:openexam@localhost:5432/openexam?schema=public
      AI_KEY_ENCRYPTION_SECRET: openexam-ci-ai-key-encryption-secret
      NEXT_TELEMETRY_DISABLED: "1"
      SESSION_SECRET: openexam-ci-session-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Browser workflows
        run: npm run test:e2e
