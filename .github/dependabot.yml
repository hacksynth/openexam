version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      next-and-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react*"
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      test-tooling:
        patterns:
          - "@playwright/*"
          - vitest
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      - dependency-name: "@prisma/client"
        update-types:
          - version-update:semver-major
      - dependency-name: "prisma"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Shanghai
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
