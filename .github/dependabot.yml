version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      next-and-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react*"
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      test-tooling:
        patterns:
          - "@playwright/*"
          - vitest

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Shanghai
    commit-message:
      prefix: chore
      include: scope
